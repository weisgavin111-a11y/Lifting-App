<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Tracker</title>
<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--tx:#1c1c1a;--mu:#6b6a64;--bd:#e2e0d9;--ac:#c2410c;--ac2:#fde8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161615;--card:#212120;--tx:#efeeea;--mu:#9c9a92;--bd:#34332f;--ac:#fb923c;--ac2:#3a2414}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161615;--card:#212120;--tx:#efeeea;--mu:#9c9a92;--bd:#34332f;--ac:#fb923c;--ac2:#3a2414}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:0 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}nav button{max-width:180px}
nav button{flex:1;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.seg button{flex:1;padding:7px 10px;border:0;background:transparent;color:var(--mu);border-radius:7px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac2);color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input.g{flex:1}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.s{padding:4px 9px;font-size:13px}
.mu{color:var(--mu);font-size:13px}.set{display:flex;gap:6px;align-items:center;margin:5px 0}.set input{width:76px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mu)}
.day{min-height:56px;border:1px solid var(--bd);border-radius:8px;padding:3px 4px;font-size:12px;background:var(--card);cursor:pointer;overflow:hidden;color:var(--tx);text-align:left}
.day.t{border-color:var(--ac)}.day.sel{background:var(--ac2)}.day.o{opacity:.35;cursor:default}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:3px}
.plan{display:block;color:var(--ac);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:inline-block;margin:0 16px 6px 0}.stat b{display:block;font-size:20px}
svg{width:100%;height:auto;display:block}.hide{display:none}
</style></head><body><main>
<h1>Lift Tracker</h1>
<nav id="nav"></nav>
<div id="v"></div>
<p class="mu" id="foot"></p>
<div id="bk"></div>
</main>
<script>
"use strict";
var S={w:[],p:{},sp:[],bw:[],gw:null},tab="lifts",sub={lifts:"log",plan:"cal",nutr:"wt"},bwD="",bwW="",D={ex:[{n:"",s:[{w:"",r:""}]}],date:"",name:""},selEx="",cal=new Date(),selDay="",store=null,tmr=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
D.date=ymd(new Date());
function e1(w,r){return r<=1?w:w*(1+r/30)}
function names(){var o={};S.w.forEach(function(x){x.ex.forEach(function(e){o[e.n]=1})});return Object.keys(o).sort()}
/* persistence: private db doc when available, else browser storage */
async function init(){
  try{var u=await claude.use("user"),db=await claude.use("db");
    if(u&&db){var id=await u.id();if(id){store=db.collection("data/users/"+id).doc("tracker");var s=await store.get();if(s.exists){var j=JSON.parse(s.data().json);S.w=j.w||[];S.p=j.p||{};S.sp=j.sp||[];S.bw=j.bw||[];S.gw=j.gw||null}}}}catch(e){store=null}
  if(!store){try{var l=JSON.parse(localStorage.getItem("lt")||"null");if(l){S.w=l.w||[];S.p=l.p||{};S.sp=l.sp||[];S.bw=l.bw||[];S.gw=l.gw||null}}catch(e){}}
  $("foot").textContent=store?"Saved privately to your account.":"Saved in this browser only.";
  backupUI();render()}
function save(){clearTimeout(tmr);tmr=setTimeout(async function(){var j=JSON.stringify(S);
  try{if(store)await store.set({json:j});else localStorage.setItem("lt",j)}catch(e){try{localStorage.setItem("lt",j)}catch(x){}}},400)}
function render(){
  var T=[["lifts","Lifts"],["plan","Planning"],["nutr","Nutrition"]],SUB={lifts:[["log","Log"],["prog","Progress"]],plan:[["cal","Calendar"],["split","Split"]],nutr:[["wt","Weight"],["kcal","Calorie Tracking"]]};
  $("nav").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+"</button>"}).join("");
  [].forEach.call($("nav").children,function(b){b.onclick=function(){tab=b.dataset.t;render()}});
  ({log:vLog,prog:vProg,cal:vCal,split:vSplit,wt:vWeight,kcal:vKcal})[sub[tab]]();
  $("v").insertAdjacentHTML("afterbegin",'<div class="seg">'+SUB[tab].map(function(t){return'<button class="'+(sub[tab]==t[0]?"on":"")+'" data-st="'+t[0]+'">'+t[1]+"</button>"}).join("")+"</div>");
  [].forEach.call($("v").querySelectorAll("[data-st]"),function(b){b.onclick=function(){sub[tab]=b.dataset.st;render()}})}
/* LOG */
function vLog(){
  var h='<div class="card"><div class="row"><input type="date" id="dt" value="'+D.date+'"><input class="g" id="nm" placeholder="Workout name (e.g. Push day)" value="'+esc(D.name)+'"></div></div>';
  D.ex.forEach(function(x,i){
    h+='<div class="card"><div class="row"><input class="g" list="exl" placeholder="Exercise" data-n="'+i+'" value="'+esc(x.n)+'"><button class="btn s" data-rx="'+i+'">Remove</button></div>';
    x.s.forEach(function(s,j){h+='<div class="set"><span class="mu">Set '+(j+1)+'</span><input type="number" inputmode="decimal" placeholder="lbs" data-w="'+i+','+j+'" value="'+esc(s.w)+'"><span>×</span><input type="number" inputmode="numeric" placeholder="reps" data-r="'+i+','+j+'" value="'+esc(s.r)+'"><button class="btn s" data-rs="'+i+','+j+'">✕</button></div>'});
    h+='<button class="btn s" data-as="'+i+'">+ Set</button></div>'});
  h+='<datalist id="exl">'+names().map(function(n){return'<option value="'+esc(n)+'">'}).join("")+"</datalist>";
  h+='<div class="row"><button class="btn" id="ae">+ Exercise</button><button class="btn p" id="sv">Save workout</button></div><h2 style="margin-top:18px">History</h2>';
  var ws=S.w.slice().sort(function(a,b){return b.date<a.date?-1:1}).slice(0,12);
  if(!ws.length)h+='<p class="mu">No workouts yet. Log your first one above.</p>';
  ws.forEach(function(w){h+='<div class="card"><div class="row"><b>'+esc(w.name||"Workout")+'</b><span class="mu">'+w.date+'</span><button class="btn s" style="margin-left:auto" data-dw="'+w.id+'">Delete</button></div>'+w.ex.map(function(e){return'<div class="mu">'+esc(e.n)+": "+e.s.map(function(s){return s.w+"×"+s.r}).join(", ")+"</div>"}).join("")+"</div>"});
  $("v").innerHTML=h;
  $("dt").onchange=function(){D.date=this.value};$("nm").oninput=function(){D.name=this.value};
  var q=function(a){return[].slice.call($("v").querySelectorAll("["+a+"]"))};
  q("data-n").forEach(function(el){el.oninput=function(){D.ex[+el.dataset.n].n=el.value}});
  q("data-w").forEach(function(el){el.oninput=function(){var p=el.dataset.w.split(",");D.ex[p[0]].s[p[1]].w=el.value}});
  q("data-r").forEach(function(el){el.oninput=function(){var p=el.dataset.r.split(",");D.ex[p[0]].s[p[1]].r=el.value}});
  q("data-rx").forEach(function(el){el.onclick=function(){D.ex.splice(+el.dataset.rx,1);if(!D.ex.length)D.ex.push({n:"",s:[{w:"",r:""}]});render()}});
  q("data-rs").forEach(function(el){el.onclick=function(){var p=el.dataset.rs.split(",");D.ex[p[0]].s.splice(p[1],1);if(!D.ex[p[0]].s.length)D.ex[p[0]].s.push({w:"",r:""});render()}});
  q("data-as").forEach(function(el){el.onclick=function(){var x=D.ex[+el.dataset.as],l=x.s[x.s.length-1];x.s.push({w:l.w,r:l.r});render()}});
  q("data-dw").forEach(function(el){el.onclick=function(){S.w=S.w.filter(function(w){return w.id!=el.dataset.dw});save();render()}});
  $("ae").onclick=function(){D.ex.push({n:"",s:[{w:"",r:""}]});render()};
  $("sv").onclick=function(){
    var ex=D.ex.map(function(x){return{n:x.n.trim(),s:x.s.filter(function(s){return +s.w>0&&+s.r>0}).map(function(s){return{w:+s.w,r:+s.r}})}}).filter(function(x){return x.n&&x.s.length});
    if(!ex.length){$("foot").textContent="Add at least one exercise with weight and reps.";return}
    S.w.push({id:Date.now(),date:D.date,name:D.name.trim(),ex:ex});
    if(S.p[D.date]===undefined&&D.name.trim())S.p[D.date]=D.name.trim();
    D={ex:[{n:"",s:[{w:"",r:""}]}],date:D.date,name:""};save();render()}}
/* PROGRESS */
function vProg(){
  var ns=names();
  if(!ns.length){$("v").innerHTML='<div class="card mu">Log a workout to see progression here.</div>';return}
  if(ns.indexOf(selEx)<0)selEx=ns[0];
  var pts=[],pr=0,vol=0,last="";
  S.w.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(w){w.ex.forEach(function(e){if(e.n!==selEx)return;
    var m=0,v=0;e.s.forEach(function(s){m=Math.max(m,e1(s.w,s.r));v+=s.w*s.r;pr=Math.max(pr,s.w)});pts.push({d:w.date,y:m});vol=v;last=w.date})});
  var h='<div class="card"><select id="se">'+ns.map(function(n){return'<option'+(n===selEx?" selected":"")+">"+esc(n)+"</option>"}).join("")+"</select></div>";
  var best=Math.max.apply(null,pts.map(function(p){return p.y}));
  h+='<div class="card"><div class="stat"><b>'+pr+' lbs</b><span class="mu">Heaviest set</span></div><div class="stat"><b>'+Math.round(best)+' lbs</b><span class="mu">Best est. 1RM</span></div><div class="stat"><b>'+vol.toLocaleString()+'</b><span class="mu">Last volume ('+last+')</span></div>';
  if(pts.length<2)h+='<p class="mu">Log this lift at least twice to see a trend line.</p>';
  else{var W=640,H=220,P=34,mn=Math.min.apply(null,pts.map(function(p){return p.y}))*.95,mx=best*1.05,xy=pts.map(function(p,i){return[P+i*(W-2*P)/(pts.length-1),H-P-(p.y-mn)/(mx-mn||1)*(H-2*P)]});
    h+='<svg viewBox="0 0 '+W+" "+H+'"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+xy.map(function(a){return a.join(",")}).join(" ")+'"/>'+xy.map(function(a,i){return'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="var(--ac)"/><text x="'+a[0]+'" y="'+(a[1]-9)+'" font-size="11" text-anchor="middle" fill="var(--mu)">'+Math.round(pts[i].y)+"</text>"}).join("")+'<text x="'+P+'" y="'+(H-8)+'" font-size="11" fill="var(--mu)">'+pts[0].d+'</text><text x="'+(W-P)+'" y="'+(H-8)+'" font-size="11" text-anchor="end" fill="var(--mu)">'+pts[pts.length-1].d+"</text></svg>"}
  h+='<p class="mu">Est. 1RM uses the Epley formula: weight × (1 + reps ÷ 30).</p></div>';
  $("v").innerHTML=h;$("se").onchange=function(){selEx=this.value;render()}}
/* CALENDAR */
function vCal(){
  var y=cal.getFullYear(),m=cal.getMonth(),f=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),td=ymd(new Date());
  var h='<div class="card"><div class="row" style="justify-content:space-between"><button class="btn s" id="pv">◀</button><b>'+f.toLocaleString("en-US",{month:"long",year:"numeric"})+'</b><button class="btn s" id="nx">▶</button></div></div><div class="grid">'+["S","M","T","W","T","F","S"].map(function(d){return'<div class="dow">'+d+"</div>"}).join("");
  for(var i=0;i<f.getDay();i++)h+='<div class="day o"></div>';
  for(var d=1;d<=n;d++){var k=ymd(new Date(y,m,d)),lg=S.w.some(function(w){return w.date===k});
    h+='<button class="day'+(k===td?" t":"")+(k===selDay?" sel":"")+'" data-k="'+k+'">'+d+(lg?'<span class="dot"></span>':"")+(S.p[k]?'<span class="plan">'+esc(S.p[k])+"</span>":"")+"</button>"}
  h+="</div>";
  if(selDay){var ws=S.w.filter(function(w){return w.date===selDay});
    h+='<div class="card" style="margin-top:12px"><h2>'+selDay+'</h2>'+(ws.length?ws.map(function(w){return'<div class="mu">✓ '+esc(w.name||"Workout")+" ("+w.ex.length+" exercises)</div>"}).join(""):'<p class="mu">Nothing logged.</p>')+'<div class="row"><input class="g" id="pl" placeholder="Plan (e.g. Legs, Rest)" value="'+esc(S.p[selDay]||"")+'"><button class="btn p" id="ps">Set plan</button><button class="btn" id="pc">Clear</button></div></div>'}
  $("v").innerHTML=h;
  $("v").insertAdjacentHTML("beforeend",mgr());wireMgr();$("pv").onclick=function(){cal=new Date(y,m-1,1);render()};$("nx").onclick=function(){cal=new Date(y,m+1,1);render()};
  [].forEach.call($("v").querySelectorAll("[data-k]"),function(b){b.onclick=function(){selDay=b.dataset.k;render()}});
  if(selDay){$("ps").onclick=function(){var v=$("pl").value.trim();if(v)S.p[selDay]=v;else delete S.p[selDay];save();render()};$("pc").onclick=function(){delete S.p[selDay];save();render()}}}
function mgr(){var n=Object.keys(S.p).length;if(!n&&!S.sp.length)return"";var h='<div class="card" style="margin-top:12px"><h2>Clear planned items</h2>';S.sp.forEach(function(s){var c=Object.keys(s.items).filter(function(k){return S.p[k]===s.items[k]}).length;h+='<div class="row" style="margin-bottom:6px"><span class="mu" style="flex:1">'+esc(s.name)+' · '+c+' days</span><button class="btn s" data-cs="'+s.id+'">Clear</button></div>'});h+='<div class="row"><button class="btn s" id="ca">Clear all planned items ('+n+')</button></div><p class="mu">Logged workouts are never removed. A split added before this update can be removed with “Clear all.”</p></div>';return h}
function wireMgr(){[].forEach.call($("v").querySelectorAll("[data-cs]"),function(b){b.onclick=function(){var s=S.sp.filter(function(x){return x.id==b.dataset.cs})[0];if(!s)return;Object.keys(s.items).forEach(function(k){if(S.p[k]===s.items[k])delete S.p[k]});S.sp=S.sp.filter(function(x){return x!==s});save();render()}});var a=$("ca");if(a)a.onclick=function(){if(a.dataset.c!=="1"){a.dataset.c="1";a.textContent="Tap again to confirm (logged workouts stay)";return}S.p={};S.sp=[];save();render()}}
function cust(){var D7=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],o=[1,2,3,4,5,6,0];var h='<div class="card"><h2>Build your own</h2><p class="mu">Type a label for each day you train (e.g. Upper, Lower) and leave rest days blank. The pattern repeats every week.</p>';o.forEach(function(d){h+='<div class="set"><span style="width:38px">'+D7[d]+'</span><input style="width:auto;flex:1" data-cd="'+d+'" placeholder="Rest"></div>'});h+='<div class="row" style="margin-top:8px"><label>Weeks <select id="cw">'+[1,2,3,4,6,8,12].map(function(n){return'<option'+(n==4?" selected":"")+'>'+n+'</option>'}).join("")+'</select></label><label>Start <input type="date" id="cs" value="'+ymd(new Date())+'"></label></div><div class="row" style="margin-top:8px"><input class="g" id="cn" placeholder="Name (e.g. Upper/Lower)"><button class="btn p" id="cb">Add to calendar</button></div><p class="mu" id="cm"></p></div>';return h}
function wireCust(){var b=$("cb");if(!b)return;b.onclick=function(){var pat={},any=false;[].forEach.call($("v").querySelectorAll("[data-cd]"),function(el){var v=el.value.trim();if(v){pat[el.dataset.cd]=v;any=true}});if(!any){$("cm").textContent="Enter a label for at least one day.";return}var wk=+$("cw").value,st=$("cs").value;if(!st){$("cm").textContent="Pick a start date.";return}var p=st.split("-"),t=new Date(+p[0],+p[1]-1,+p[2]),it={};for(var i=0;i<wk*7;i++){var c=new Date(t);c.setDate(t.getDate()+i);var lb=pat[c.getDay()];if(lb){var k=ymd(c);S.p[k]=lb;it[k]=lb}}S.sp.push({id:Date.now(),name:($("cn").value.trim()||"Custom split")+" · started "+st,items:it});save();tab="plan";sub.plan="cal";cal=new Date(t);render()}}
/* SPLIT */
var X={Push:"Bench Press, Incline DB Press, Overhead Press, Lateral Raise, Triceps Pushdown",Pull:"Pull-Up, Barbell Row, Seated Cable Row, Face Pull, Biceps Curl",Legs:"Squat, Romanian Deadlift, Leg Press, Leg Curl, Calf Raise",Upper:"Bench Press, Barbell Row, Overhead Press, Pull-Up, Curl, Triceps Pushdown",Lower:"Squat, Romanian Deadlift, Leg Press, Leg Curl, Calf Raise","Full Body":"Squat, Bench Press, Barbell Row, Overhead Press, Romanian Deadlift","Arms & Shoulders":"Overhead Press, Lateral Raise, Rear Delt Fly, Barbell Curl, Skull Crusher, Hammer Curl"};
var SP={2:["Full Body","Full Body"],3:["Full Body","Full Body","Full Body"],4:["Upper","Lower","Upper","Lower"],5:["Upper","Lower","Push","Pull","Legs"],6:["Push","Pull","Legs","Push","Pull","Legs"]};
var WD={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,4,5,6],6:[1,2,3,4,5,6]},plan=null;
function vSplit(){
  var h='<div class="card"><h2>Suggest a split</h2><div class="row"><label>Days/week <select id="sd"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Focus <select id="sf"><option>Balanced</option><option>Arms &amp; shoulders</option><option>Legs</option></select></label><label>Level <select id="sl"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></label></div><p><button class="btn p" id="go">Suggest</button></p></div><div id="out"></div>'+cust();
  $("v").innerHTML=h;
  wireCust();$("go").onclick=function(){
    var d=+$("sd").value,f=$("sf").value,l=$("sl").value,days=SP[d].slice();
    if(f.indexOf("Arms")==0&&d>=4)days[days.length-1]="Arms & Shoulders";
    var sets={Beginner:"2–3",Intermediate:"3–4",Advanced:"4–5"}[l];
    plan={days:days,wd:WD[d],nm:d+"-day "+f.toLowerCase()+" split"};
    var o='<div class="card"><h2>'+d+"-day split</h2>"+days.map(function(x,i){return'<p><b>Day '+(i+1)+": "+x+'</b><br><span class="mu">'+X[x]+"</span></p>"}).join("")+'<p class="mu">Aim for '+sets+" working sets per exercise, 6–12 reps, and add weight or a rep when you hit the top of the range.</p>";
    if(f.indexOf("Arms")==0&&d<4)o+='<p class="mu">With fewer than 4 days, finish each session with 2–3 sets of curls, pushdowns and lateral raises to emphasize arms and shoulders.</p>';
    if(f==="Legs")o+='<p class="mu">For a leg focus, add a second quad or hamstring movement to each lower or legs day.</p>';
    if(l==="Beginner"&&d>4)o+='<p class="mu">As a beginner, 3–4 days is usually enough to recover and progress.</p>';
    o+='<button class="btn p" id="ap">Put the next 4 weeks on my calendar</button></div>';
    $("out").innerHTML=o;
    $("ap").onclick=function(){var t=new Date();t.setHours(0,0,0,0);var it={};
      for(var i=0;i<28;i++){var c=new Date(t);c.setDate(t.getDate()+i);var ix=plan.wd.indexOf(c.getDay());
        if(ix>=0){var k=ymd(c),lb=plan.days[(Math.floor(i/7)*plan.wd.length+ix)%plan.days.length];S.p[k]=lb;it[k]=lb}}
      S.sp.push({id:Date.now(),name:plan.nm+" · started "+ymd(t),items:it});save();tab="plan";sub.plan="cal";cal=new Date();render()}}}
/* NUTRITION */
function vKcal(){$("v").innerHTML='<div class="card mu">Calorie tracking is coming soon.</div>'}
function vWeight(){
  var td=ymd(new Date()),a=S.bw.slice().sort(function(x,y){return x.d<y.d?-1:1}),g=S.gw>0?S.gw:null;
  var h='<div class="card"><h2>Body weight</h2><div class="row"><input type="date" id="bd" value="'+(bwD||td)+'"><input type="number" inputmode="decimal" id="bw" placeholder="lbs" style="width:90px" value="'+esc(bwW)+'"><button class="btn p" id="ba">Add</button></div><p class="mu" id="bm">One entry per day; adding the same date replaces it.</p></div>';
  h+='<div class="card"><h2>Goal weight</h2><div class="row"><input type="number" inputmode="decimal" id="gi" placeholder="lbs" style="width:90px" value="'+(g||"")+'"><button class="btn p" id="gs">Set goal</button>'+(g?'<button class="btn" id="gc">Clear</button>':"")+'</div></div>';
  if(a.length){
    var L=a[a.length-1],f=a[0],ch=Math.round((L.w-f.w)*10)/10;
    h+='<div class="card"><div class="stat"><b>'+L.w+' lbs</b><span class="mu">Latest ('+L.d+')</span></div>';
    if(a.length>1)h+='<div class="stat"><b>'+(ch>0?"+":"")+ch+' lbs</b><span class="mu">Since '+f.d+'</span></div>';
    if(g){var rem=Math.round((g-L.w)*10)/10,dir=g-f.w,hit=dir===0?L.w===g:(dir<0?L.w<=g:L.w>=g),pct=dir===0?100:Math.max(0,Math.min(100,Math.round((L.w-f.w)/(g-f.w)*100)));
      h+='<div class="stat"><b>'+g+' lbs</b><span class="mu">Goal</span></div><div class="stat"><b>'+(hit?"Reached 🎯":Math.abs(rem)+" lbs")+'</b><span class="mu">'+(hit?"Goal weight hit":(rem<0?"To lose":"To gain"))+'</span></div>';
      h+='<div style="height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:4px 0 4px"><div style="height:100%;width:'+pct+'%;background:var(--ac)"></div></div><p class="mu" style="margin:0 0 8px">'+pct+'% of the way from your first entry ('+f.w+' lbs) to your goal</p>'}
    else h+='<p class="mu">Set a goal weight above to compare it to your progress.</p>';
    if(a.length>1){
      var W=640,H=240,PL=44,PR=16,PT=16,PB=34,ys=a.map(function(p){return p.w});if(g)ys.push(g);
      var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),pad=Math.max((mx-mn)*.12,1);mn-=pad;mx+=pad;
      var X=function(i){return PL+i*(W-PL-PR)/(a.length-1)},Y=function(v){return H-PB-(v-mn)/(mx-mn)*(H-PT-PB)};
      var s='<svg viewBox="0 0 '+W+' '+H+'">';
      [0,1,2,3].forEach(function(k){var v=mn+(mx-mn)*k/3,y=Y(v);s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)" stroke-width="1"/><text x="'+(PL-6)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="var(--mu)">'+Math.round(v*10)/10+'</text>'});
      if(g)s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--mu)" stroke-width="2" stroke-dasharray="6 5"/><text x="'+(W-PR)+'" y="'+(Y(g)-6)+'" font-size="11" font-weight="600" text-anchor="end" fill="var(--mu)">Goal '+g+'</text>';
      s+='<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+a.map(function(p,i){return X(i)+","+Y(p.w)}).join(" ")+'"/>';
      a.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.w)+'" r="4" fill="var(--ac)"/>';if(a.length<=12)s+='<text x="'+X(i)+'" y="'+(Y(p.w)-9)+'" font-size="11" text-anchor="middle" fill="var(--tx)">'+p.w+'</text>'});
      s+='<text x="'+PL+'" y="'+(H-8)+'" font-size="11" fill="var(--mu)">'+a[0].d+'</text><text x="'+(W-PR)+'" y="'+(H-8)+'" font-size="11" text-anchor="end" fill="var(--mu)">'+L.d+'</text></svg>';
      h+=s}
    else h+='<p class="mu">Add a second weigh-in to see your trend line.</p>';
    h+='</div><h2>History</h2>'+a.slice().reverse().slice(0,14).map(function(p){return'<div class="card"><div class="row"><b>'+p.w+' lbs</b><span class="mu">'+p.d+'</span><button class="btn s" style="margin-left:auto" data-db="'+p.d+'">Delete</button></div></div>'}).join("")}
  else h+='<p class="mu">No entries yet. Add your first weigh-in above.</p>';
  $("v").innerHTML=h;
  $("bd").onchange=function(){bwD=this.value};$("bw").oninput=function(){bwW=this.value};
  $("ba").onclick=function(){var d=$("bd").value,w=parseFloat($("bw").value);if(!d||!(w>0)){$("bm").textContent="Enter a date and a weight.";return}
    S.bw=S.bw.filter(function(p){return p.d!==d});S.bw.push({d:d,w:Math.round(w*10)/10});bwW="";save();render()};
  $("gs").onclick=function(){var v=parseFloat($("gi").value);if(!(v>0))return;S.gw=Math.round(v*10)/10;save();render()};
  var gc=$("gc");if(gc)gc.onclick=function(){S.gw=null;save();render()};
  [].forEach.call($("v").querySelectorAll("[data-db]"),function(b){b.onclick=function(){S.bw=S.bw.filter(function(p){return p.d!==b.dataset.db});save();render()}})}
/* BACKUP (browser-storage mode only) */
function backupUI(){
  if(store)return;
  $("bk").innerHTML='<div class="card"><h2>Backup</h2><div class="row"><button class="btn" id="bx">Export data</button><button class="btn" id="bi">Import data</button><input type="file" id="bf" accept="application/json,.json" class="hide"></div><p class="mu" id="bt">Export a file to back up your data or move it to another device. Importing merges with what is already here.</p></div>';
  $("bx").onclick=function(){var blob=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lift-tracker-"+ymd(new Date())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);$("bt").textContent="Exported."};
  $("bi").onclick=function(){$("bf").click()};
  $("bf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{
    var j=JSON.parse(r.result);if(!j||typeof j!=="object"||(!Array.isArray(j.w)&&!Array.isArray(j.bw)))throw 0;
    var ids={};S.w.forEach(function(x){ids[x.id]=1});(j.w||[]).forEach(function(x){if(x&&x.id&&!ids[x.id]&&x.date&&Array.isArray(x.ex)){S.w.push(x);ids[x.id]=1}});
    var bd={};S.bw.forEach(function(x){bd[x.d]=x});(j.bw||[]).forEach(function(x){if(x&&x.d&&+x.w>0)bd[x.d]={d:x.d,w:+x.w}});S.bw=Object.keys(bd).map(function(k){return bd[k]});
    Object.keys(j.p||{}).forEach(function(k){if(S.p[k]===undefined)S.p[k]=j.p[k]});
    var si={};S.sp.forEach(function(x){si[x.id]=1});(j.sp||[]).forEach(function(x){if(x&&x.id&&!si[x.id]){S.sp.push(x);si[x.id]=1}});
    if(+j.gw>0&&!S.gw)S.gw=+j.gw;
    save();render();$("bt").textContent="Imported and merged."}catch(e){$("bt").textContent="That file isn't a Lift Tracker backup."}};r.readAsText(f);this.value=""};
}
init();
